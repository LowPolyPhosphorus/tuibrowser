[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tuibrowser"
version = "0.1.0"
description = "A terminal web browser with tabs, reader mode, form filling, and an option Playwright layout mode"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "LowPolyPhosphorus"}]
keywords = ["terminal", "tui", "browser", "textual"]
classifiers = [
    "Enviroment :: Console",
    "Programming language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Browser",
]
dependencies = ["textual", "httpx", "beautifulsoup4", "lxml", "pillow"]

[project.urls]
Homepage = "https://github.com/LowPolyPhosphorus/tuibrowser"
Issues = "https://github.com/LowPolyPhosphorus/tuibrowser/issues"

[project.scripts]
tuibrowser = "tuibrowser.app:main"

[project.optional-dependencies]
js = ["playwright"]

[tool.setuptools.packages.find]
where = ["src"]