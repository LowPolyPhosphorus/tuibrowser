[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tuibrowser"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["textual", "httpx", "beautifulsoup4"]

[project.scripts]
tuibrowser = "tuibrowser.app:main"

[tool.setuptools.packages.find]
where = ["src"]